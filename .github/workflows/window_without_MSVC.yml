name: Build clang-p2996 Windows (self-contained libc++)

on:
  workflow_dispatch:

jobs:
  build-windows:

    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}\install


    steps:

    # --------------------------
    # Checkout clang-p2996
    # --------------------------
    - name: Checkout clang-p2996
      uses: actions/checkout@v4
      with:
        repository: bloomberg/clang-p2996
        ref: p2996
        path: llvm
        fetch-depth: 1


    # --------------------------
    # MinGW 环境（windows-latest 自带 C:\mingw64）
    # --------------------------
    - name: Setup MinGW
      shell: cmd
      run: |
        where gcc g++
        gcc --version
        g++ --version


    # --------------------------
    # Dependencies
    # --------------------------
    - name: Install dependencies
      shell: powershell
      run: |
        choco install ninja cmake python -y


    # --------------------------
    # Configure
    # --------------------------
    - name: Configure LLVM
      shell: cmd
      run: |

        cmake -S llvm/llvm -B build -G Ninja ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DCMAKE_INSTALL_PREFIX=%INSTALL_DIR% ^

          -DCMAKE_C_COMPILER=gcc ^
          -DCMAKE_CXX_COMPILER=g++ ^
          -DCMAKE_ASM_COMPILER=gcc ^

          -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-w64-windows-gnu ^

          -DLLVM_ENABLE_PROJECTS="clang;lld" ^

          -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" ^

          -DLLVM_TARGETS_TO_BUILD=X86 ^

          -DLLVM_ENABLE_ASSERTIONS=OFF ^
          -DLLVM_INCLUDE_TESTS=OFF ^
          -DLLVM_INCLUDE_DOCS=OFF ^
          -DLLVM_INCLUDE_EXAMPLES=OFF ^
          -DLLVM_INCLUDE_BENCHMARKS=OFF ^

          -DLLVM_INSTALL_UTILS=ON ^

          -DLIBCXX_ENABLE_SHARED=OFF ^
          -DLIBCXX_ENABLE_STATIC=ON ^
          -DLIBCXX_ENABLE_ABI_LIBRARY=libcxxabi ^
          -DLIBCXX_ENABLE_EXCEPTIONS=ON ^
          -DLIBCXX_ENABLE_RTTI=ON ^

          -DLIBCXXABI_ENABLE_SHARED=OFF ^
          -DLIBCXXABI_ENABLE_STATIC=ON ^
          -DLIBCXXABI_ENABLE_EXCEPTIONS=ON ^
          -DLIBCXXABI_ENABLE_RTTI=ON ^

          -DLIBUNWIND_ENABLE_SHARED=OFF ^
          -DLIBUNWIND_ENABLE_STATIC=ON ^

          -DCOMPILER_RT_BUILD_SANITIZERS=OFF ^
          -DCOMPILER_RT_BUILD_XRAY=OFF ^
          -DCOMPILER_RT_BUILD_LIBFUZZER=OFF ^
          -DCOMPILER_RT_BUILD_PROFILE=OFF ^
          -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON ^

          -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
          -DLLVM_PARALLEL_LINK_JOBS=1


    # --------------------------
    # Build
    # --------------------------
    - name: Build LLVM
      shell: cmd
      run: |
        cmake --build build --parallel


    # --------------------------
    # Install
    # --------------------------
    - name: Install LLVM
      shell: cmd
      run: |
        cmake --install build


    # --------------------------
    # 生成 clang++.cfg（绝对路径，任何工作目录下都有效）
    # --------------------------
    - name: Create clang++ config
      shell: cmd
      run: |

        (
          echo -stdlib=libc++
          echo -isystem "%INSTALL_DIR%\include\c++\v1"
          echo -L "%INSTALL_DIR%\lib"
          echo -fuse-ld=lld
        ) > "%INSTALL_DIR%\bin\clang++.cfg"

        echo --- clang++.cfg ---
        type "%INSTALL_DIR%\bin\clang++.cfg"
        echo --------------------


    # --------------------------
    # 生成可重定位辅助脚本
    # 工具链拷到别的机器后，运行一次即可重新生成 cfg
    # --------------------------
    - name: Create relocation helper
      shell: powershell
      run: |
        $script = @'
        $root = Split-Path -Parent $MyInvocation.MyCommand.Path
        $bin  = Join-Path $root 'bin'
        $cfg  = Join-Path $bin 'clang++.cfg'
        @(
          '-stdlib=libc++',
          "-isystem `"$(Join-Path $root 'include\c++\v1')`"",
          "-L `"$(Join-Path $root 'lib')`"",
          '-fuse-ld=lld'
        ) | Set-Content -Path $cfg -Encoding ascii
        Write-Host "clang++.cfg updated for: $bin"
        Get-Content $cfg
        '@
        Set-Content -Path "${{ env.INSTALL_DIR }}\fix-libcxx-cfg.ps1" -Value $script -Encoding ascii


    # --------------------------
    # Check clang
    # --------------------------
    - name: Test clang
      shell: cmd
      run: |

        %INSTALL_DIR%\bin\clang.exe --version
        %INSTALL_DIR%\bin\clang++.exe --version


    # --------------------------
    # Test libc++（无需任何额外参数）
    # --------------------------
    - name: Test libc++
      shell: cmd
      run: |

        echo #include ^<vector^> > test.cpp
        echo int main(){std::vector^<int^> v{1,2,3};} >> test.cpp

        %INSTALL_DIR%\bin\clang++.exe test.cpp -std=c++26 -o test.exe

        test.exe


    # --------------------------
    # Test Reflection（无需任何额外参数）
    # --------------------------
    - name: Test Reflection
      shell: cmd
      continue-on-error: true
      run: |

        echo struct A{int x;}; > reflection.cpp
        echo constexpr auto r = ^^A; >> reflection.cpp
        echo int main(){} >> reflection.cpp

        %INSTALL_DIR%\bin\clang++.exe reflection.cpp -std=c++26 -freflection -o reflection.exe

        reflection.exe


    # --------------------------
    # Package
    # --------------------------
    - name: Package
      shell: powershell
      run: |

        Compress-Archive `
          -Path "${{ env.INSTALL_DIR }}\*" `
          -DestinationPath clang-p2996-windows-libcxx.zip `
          -CompressionLevel Optimal


    # --------------------------
    # Upload
    # --------------------------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: clang-p2996-windows-libcxx
        path: clang-p2996-windows-libcxx.zip
        compression-level: 0
