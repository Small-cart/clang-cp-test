name: Build Clang P2996

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_REPO: bloomberg/clang-p2996
  LLVM_BRANCH: p2996
  BUILD_TYPE: Release
  SCCACHE_VERSION: "0.10.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            platform: linux
          - os: windows-2022
            name: windows-x86_64
            platform: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    env:
      INSTALL_DIR: ${{ github.workspace }}/install
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout clang-p2996
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLVM_REPO }}
          ref: ${{ env.LLVM_BRANCH }}
          fetch-depth: 1

      ############################################################
      # Free disk space
      ############################################################

      - name: Free disk space Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Free disk space Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          Remove-Item "C:\hostedtoolcache\windows\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive C

      ############################################################
      # Dependencies
      ############################################################

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git curl xz-utils mold lld zlib1g-dev libxml2-dev libzstd-dev libedit-dev libncurses-dev

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja Windows
        if: matrix.platform == 'windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      ############################################################
      # sccache cache
      ############################################################

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}
          restore-keys: |
            sccache-${{ runner.os }}

      ############################################################
      # Install sccache Linux
      ############################################################

      - name: Install sccache Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p $HOME/bin
          curl -L "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o sccache.tar.gz
          tar -xf sccache.tar.gz
          mv sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache $HOME/bin/sccache
          chmod +x $HOME/bin/sccache
          echo "$HOME/bin" >> $GITHUB_PATH
          sccache --version
          sccache --start-server

      ############################################################
      # Install sccache Windows
      ############################################################

      - name: Install sccache Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $version=$env:SCCACHE_VERSION
          $url="https://github.com/mozilla/sccache/releases/download/v$version/sccache-v$version-x86_64-pc-windows-msvc.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile sccache.tar.gz
          tar -xf sccache.tar.gz
          $dir="sccache-v$version-x86_64-pc-windows-msvc"
          echo "$PWD\$dir" >> $env:GITHUB_PATH
          & "$PWD\$dir\sccache.exe" --version
          & "$PWD\$dir\sccache.exe" --start-server

      ############################################################
      # Configure Linux
      ############################################################

      - name: Configure Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR} \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_USE_LINKER=mold \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DLLVM_PARALLEL_COMPILE_JOBS=4 \
            -DLLVM_PARALLEL_LINK_JOBS=1

      ############################################################
      # Configure Windows
      ############################################################

      - name: Configure Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          cmake -S llvm -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_INSTALL_PREFIX=%INSTALL_DIR% ^
            -DLLVM_ENABLE_PROJECTS="clang;lld" ^
            -DLLVM_TARGETS_TO_BUILD=X86 ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_DOCS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
            -DLLVM_PARALLEL_LINK_JOBS=1

      ############################################################
      # Build
      ############################################################

      - name: Build clang
        shell: bash
        run: |
          cmake --build build --target install --parallel

      ############################################################
      # Verify Reflection
      ############################################################

      - name: Test C++26 Reflection
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            CXX="${INSTALL_DIR}/bin/clang++"
          else
            CXX="${INSTALL_DIR}/bin/clang++.exe"
          fi

          echo "Testing:"
          $CXX --version

          # Generate test file using echo to avoid heredoc indentation issues in YAML
          echo "#include <meta>" > reflection_test.cpp
          echo "#include <iostream>" >> reflection_test.cpp
          echo "" >> reflection_test.cpp
          echo "int main()" >> reflection_test.cpp
          echo "{" >> reflection_test.cpp
          echo "    constexpr auto info = ^^int;" >> reflection_test.cpp
          echo "" >> reflection_test.cpp
          echo "    std::cout" >> reflection_test.cpp
          echo "        << std::meta::display_string_of(info)" >> reflection_test.cpp
          echo "        << \"\\n\";" >> reflection_test.cpp
          echo "}" >> reflection_test.cpp

          $CXX reflection_test.cpp \
            -std=c++2c \
            -o reflection_test

          echo "Reflection OK"

      ############################################################
      # sccache statistics
      ############################################################

      - name: sccache statistics
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true

      ############################################################
      # Generate build information
      ############################################################

      - name: Generate build info
        shell: bash
        run: |
          mkdir -p install/share/clang-p2996
          {
            echo "LLVM repository:"
            echo "${LLVM_REPO}"
            echo ""
            echo "LLVM branch:"
            echo "${LLVM_BRANCH}"
            echo ""
            echo "Commit:"
            echo "$(git rev-parse HEAD)"
            echo ""
            echo "Build type:"
            echo "${BUILD_TYPE}"
            echo ""
            echo "Platform:"
            echo "${{ matrix.name }}"
            echo ""
            echo "Date:"
            echo "$(date -u)"
          } > install/share/clang-p2996/build-info.txt

      ############################################################
      # Package Linux
      ############################################################

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          tar -C install \
            -cJf clang-p2996-${{ matrix.name }}.tar.xz .

      ############################################################
      # Package Windows
      ############################################################

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          Compress-Archive `
            -Path install\* `
            -DestinationPath clang-p2996-${{ matrix.name }}.zip

      ############################################################
      # Upload Linux artifact
      ############################################################

      - name: Upload Linux toolchain
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: clang-p2996-linux-x86_64
          path: clang-p2996-${{ matrix.name }}.tar.xz
          compression-level: 0

      ############################################################
      # Upload Windows artifact
      ############################################################

      - name: Upload Windows toolchain
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: clang-p2996-windows-x86_64
          path: clang-p2996-${{ matrix.name }}.zip
          compression-level: 0

      ############################################################
      # Upload failure logs
      ############################################################

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-p2996-log-${{ matrix.name }}
          path: |
            build/CMakeCache.txt
            build/**/*.log
          if-no-files-found: ignore

      ############################################################
      # Summary
      ############################################################

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "================================="
          echo "Clang P2996 build finished"
          echo "Platform: ${{ matrix.name }}"
          echo "================================="
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ${INSTALL_DIR}/bin/clang++ --version || true
          else
            "${INSTALL_DIR}/bin/clang++.exe" --version || true
          fi
