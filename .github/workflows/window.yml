name: Build clang-p2996 Windows

on:
  workflow_dispatch:

jobs:
  build-windows:

    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}\install


    steps:

    # --------------------------
    # Checkout clang-p2996
    # --------------------------
    - name: Checkout clang-p2996
      uses: actions/checkout@v4
      with:
        repository: bloomberg/clang-p2996
        ref: p2996
        path: llvm
        fetch-depth: 1


    # --------------------------
    # MSVC environment
    # --------------------------
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1


    # --------------------------
    # Dependencies
    # --------------------------
    - name: Install dependencies
      shell: powershell
      run: |
        choco install ninja cmake python -y


    # --------------------------
    # Configure
    # --------------------------
    - name: Configure LLVM
      shell: cmd
      run: |

        cmake -S llvm/llvm -B build -G Ninja ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DCMAKE_INSTALL_PREFIX=%INSTALL_DIR% ^

          -DCMAKE_C_COMPILER=clang-cl ^
          -DCMAKE_CXX_COMPILER=clang-cl ^

          -DLLVM_ENABLE_PROJECTS="clang;lld" ^

          -DLLVM_ENABLE_RUNTIMES="libcxx" ^

          -DLLVM_TARGETS_TO_BUILD=X86 ^

          -DLLVM_ENABLE_ASSERTIONS=OFF ^
          -DLLVM_INCLUDE_TESTS=OFF ^
          -DLLVM_INCLUDE_DOCS=OFF ^
          -DLLVM_INCLUDE_EXAMPLES=OFF ^
          -DLLVM_INCLUDE_BENCHMARKS=OFF ^

          -DLLVM_INSTALL_UTILS=ON ^

          -DLIBCXX_ENABLE_SHARED=OFF ^
          -DLIBCXX_ENABLE_STATIC=ON ^

          -DLIBCXX_ENABLE_EXCEPTIONS=ON ^
          -DLIBCXX_ENABLE_RTTI=ON ^

          -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
          -DLLVM_PARALLEL_LINK_JOBS=1


    # --------------------------
    # Build
    # --------------------------
    - name: Build LLVM
      shell: cmd
      run: |
        cmake --build build --parallel


    # --------------------------
    # Install
    # --------------------------
    - name: Install LLVM
      shell: cmd
      run: |
        cmake --install build


    # --------------------------
    # Check clang
    # --------------------------
    - name: Test clang
      shell: cmd
      run: |

        %INSTALL_DIR%\bin\clang.exe --version
        %INSTALL_DIR%\bin\clang-cl.exe --version


    # --------------------------
    # Test libc++
    # --------------------------
    - name: Test libc++
      shell: cmd
      run: |

        echo #include ^<vector^> > test.cpp
        echo int main(){std::vector^<int^> v{1,2,3};} >> test.cpp

        %INSTALL_DIR%\bin\clang-cl.exe ^
          test.cpp ^
          /std:c++26 ^
          /EHsc


    # --------------------------
    # Test Reflection
    # --------------------------
    - name: Test Reflection
      shell: cmd
      continue-on-error: true
      run: |

        echo struct A{int x;}; > reflection.cpp
        echo constexpr auto r = ^^A; >> reflection.cpp
        echo int main(){} >> reflection.cpp

        %INSTALL_DIR%\bin\clang++.exe ^
          reflection.cpp ^
          -std=c++26 ^
          -freflection


    # --------------------------
    # Package
    # --------------------------
    - name: Package
      shell: powershell
      run: |

        Compress-Archive `
          -Path "${{ env.INSTALL_DIR }}\*" `
          -DestinationPath clang-p2996-windows.zip `
          -CompressionLevel Optimal


    # --------------------------
    # Upload
    # --------------------------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: clang-p2996-windows
        path: clang-p2996-windows.zip
        compression-level: 0
