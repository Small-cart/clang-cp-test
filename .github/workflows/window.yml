name: Build clang-p2996 Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}\install


    steps:

    - name: Checkout clang-p2996
      uses: actions/checkout@v4
      with:
        repository: bloomberg/clang-p2996
        ref: p2996
        path: llvm
        fetch-depth: 1


    - name: Install dependencies
      shell: powershell
      run: |
        choco install ninja cmake python -y


    - name: Configure
      shell: cmd
      run: |

        cmake -S llvm/llvm -B build -G Ninja ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DCMAKE_INSTALL_PREFIX=%INSTALL_DIR% ^

          -DLLVM_ENABLE_PROJECTS="clang;lld" ^

          -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" ^

          -DLLVM_TARGETS_TO_BUILD=X86 ^

          -DLLVM_ENABLE_ASSERTIONS=OFF ^
          -DLLVM_INCLUDE_TESTS=OFF ^
          -DLLVM_INCLUDE_DOCS=OFF ^
          -DLLVM_INCLUDE_EXAMPLES=OFF ^
          -DLLVM_INCLUDE_BENCHMARKS=OFF ^

          -DLLVM_ENABLE_TERMINFO=OFF ^
          -DLLVM_ENABLE_ZLIB=OFF ^

          -DLLVM_INSTALL_UTILS=ON ^

          -DLIBCXX_ENABLE_SHARED=OFF ^
          -DLIBCXX_ENABLE_STATIC=ON ^

          -DLIBCXXABI_ENABLE_SHARED=OFF ^
          -DLIBCXXABI_ENABLE_STATIC=ON ^

          -DLIBUNWIND_ENABLE_SHARED=OFF ^
          -DLIBUNWIND_ENABLE_STATIC=ON ^

          -DCMAKE_C_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER=cl ^

          -DLLVM_PARALLEL_COMPILE_JOBS=4 ^
          -DLLVM_PARALLEL_LINK_JOBS=1


    - name: Build
      shell: cmd
      run: |
        cmake --build build --parallel


    - name: Install
      shell: cmd
      run: |
        cmake --install build


    - name: Test clang
      shell: cmd
      run: |

        %INSTALL_DIR%\bin\clang.exe --version


    - name: Test Reflection
      shell: cmd
      continue-on-error: true
      run: |

        echo struct A{int x;}; > test.cpp
        echo constexpr auto r=^^A; >> test.cpp
        echo int main(){} >> test.cpp

        %INSTALL_DIR%\bin\clang++.exe ^
          test.cpp ^
          -std=c++26 ^
          -freflection


    - name: Package
      shell: powershell
      run: |

        Compress-Archive `
          -Path "${{ env.INSTALL_DIR }}\*" `
          -DestinationPath clang-p2996-windows.zip


    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: clang-p2996-windows
        path: clang-p2996-windows.zip
